# JScreenScriber – FlatLaf dark theme (loaded via FlatLaf.registerCustomDefaultsSource)

# ---- palette variables ----
@win = #282c34
@titlebar = #21252b
@menubar = #21252b
@toolbar = #21252b
@sidebar = #21252b
@sideHeader = #21252b
@viewport = #1e2227
@page = #282c34
@pageBorder = #3e4451
@text = #abb2bf
@muted = #5c6370
@accent = #61afef
@accentDark = #61afef
@accentBg = #2d4257
@accentBorder = #61afef
@border = #181a1f
@btnBorder = #3e4451
@btnBg = #282c34
@btnHover = #353b45
@input = #1e2227
@inputBorder = #3e4451
@track = #21252b
@thumb = #3e4451
@thumbBorder = #4b5263
@cursor = #56b6c2
@tag = #56b6c2
@tagBg = #282c34
@listActive = #2c313a
@listHover = #282c34
@listItem = #21252b
@closeBg = #3c2427
@closeBorder = #632e34
@closeFg = #e06c75
@status = #21252b
@statusSep = #181a1f
@ok = #98c379
@sceneC = #e5c07b
@actionC = #abb2bf
@charC = #61afef
@parenC = #5c6370
@dialogC = #d7dae0
@transC = #c678dd
@pageNum = #5c6370
@noteC = #d19a66
@selection = #61afef50
@dim = #282c3496

# ---- app colours read by the custom-drawn components (Theme.Palette) ----
JSS.win = @win
JSS.titlebar = @titlebar
JSS.menubar = @menubar
JSS.toolbar = @toolbar
JSS.sidebar = @sidebar
JSS.sideHeader = @sideHeader
JSS.viewport = @viewport
JSS.page = @page
JSS.pageBorder = @pageBorder
JSS.text = @text
JSS.muted = @muted
JSS.accent = @accent
JSS.accentDark = @accentDark
JSS.accentBg = @accentBg
JSS.accentBorder = @accentBorder
JSS.border = @border
JSS.btnBorder = @btnBorder
JSS.btnBg = @btnBg
JSS.btnHover = @btnHover
JSS.input = @input
JSS.inputBorder = @inputBorder
JSS.track = @track
JSS.thumb = @thumb
JSS.thumbBorder = @thumbBorder
JSS.cursor = @cursor
JSS.tag = @tag
JSS.tagBg = @tagBg
JSS.listActive = @listActive
JSS.listHover = @listHover
JSS.listItem = @listItem
JSS.closeBg = @closeBg
JSS.closeBorder = @closeBorder
JSS.closeFg = @closeFg
JSS.status = @status
JSS.statusSep = @statusSep
JSS.ok = @ok
JSS.sceneC = @sceneC
JSS.actionC = @actionC
JSS.charC = @charC
JSS.parenC = @parenC
JSS.dialogC = @dialogC
JSS.transC = @transC
JSS.pageNum = @pageNum
JSS.noteC = @noteC
JSS.selection = @selection
JSS.dim = @dim

# ---- global FlatLaf look ----
@background = @win
@foreground = @text
@accentColor = @accent
Component.arc = 3
Button.arc = 3
TextComponent.arc = 2
CheckBox.arc = 2
Component.focusWidth = 0
Button.focusWidth = 0
Component.innerFocusWidth = 0
Component.hideMnemonics = true

Button.background = @btnBg
Button.foreground = @text
Button.borderColor = @btnBorder
Button.hoverBackground = @btnHover
Button.pressedBackground = @listActive
Button.hoverBorderColor = @inputBorder
Button.default.background = @accent
Button.default.foreground = #ffffff
Button.default.borderColor = @accent
Button.margin = 2,6,2,6
Button.minimumWidth = 24
Button.iconTextGap = 4
ToggleButton.margin = 2,6,2,6
Button.selectedBackground = @accentBg
Button.selectedForeground = @accentDark
Button.toolbar.hoverBackground = @btnHover

ToggleButton.background = @btnBg
ToggleButton.foreground = @text
ToggleButton.selectedBackground = @accentBg
ToggleButton.selectedForeground = @accentDark
ToggleButton.hoverBackground = @btnHover
ToggleButton.borderColor = @btnBorder
ToggleButton.selectedBorderColor = @accentBorder

Panel.background = @win
Label.foreground = @text
TextField.background = @input
TextField.foreground = @text
TextField.margin = 2,6,2,6
Spinner.padding = 2,6,2,6
ComboBox.padding = 2,6,2,6
TextArea.background = @input
ComboBox.background = @input
Spinner.background = @input
Component.borderColor = @inputBorder
Component.focusedBorderColor = @accent

List.background = @sidebar
List.selectionBackground = @listActive
List.selectionForeground = @accentDark

MenuBar.background = @menubar
MenuBar.borderColor = @border
MenuBar.hoverBackground = @accentBg
MenuBar.itemMargins = 2,7,2,7
Menu.selectionBackground = @accentBg
Menu.selectionForeground = @accent
MenuItem.selectionBackground = @accentBg
MenuItem.selectionForeground = @accent
MenuItem.margin = 2,6,2,6
PopupMenu.borderColor = @border
PopupMenu.background = @page
Separator.foreground = @btnBorder
SplitPane.background = @win
TabbedPane.background = @win
TabbedPane.selectedBackground = @accentBg
ToolTip.background = @page
ToolTip.foreground = @text

# ---- 12px scrollbars with arrow steppers ----
ScrollBar.width = 12
ScrollBar.showButtons = true
ScrollBar.trackArc = 0
ScrollBar.thumbArc = 0
ScrollBar.thumbInsets = 1,1,1,1
ScrollBar.trackInsets = 0,0,0,0
ScrollBar.track = @track
ScrollBar.thumb = @thumb
ScrollBar.hoverThumbColor = @thumbBorder
ScrollBar.pressedThumbColor = @accent
ScrollBar.buttonArrowColor = @muted
ScrollBar.hoverButtonBackground = @accentBg
ScrollBar.pressedButtonBackground = @accentBg
ScrollPane.background = @viewport
